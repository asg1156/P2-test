<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>P2P Debug</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; padding: 10px; }
        .error { color: red; background: #ffdada; padding: 10px; border-radius: 5px; display: none; margin-bottom: 10px; }
        textarea { width: 100%; height: 60px; font-size: 10px; margin: 5px 0; }
        button { width: 100%; padding: 12px; margin: 5px 0; cursor: pointer; border: none; border-radius: 5px; background: #28a745; color: white; }
        #log { font-size: 12px; color: #666; background: #eee; padding: 5px; height: 50px; overflow: scroll; }
    </style>
</head>
<body>
    <div id="errBox" class="error"></div>
    <div id="log">Лог событий...</div>

    <h3>1. Алиса</h3>
    <button onclick="handleCreate()">Создать Оффер</button>
    <textarea id="outBox" readonly placeholder="Результат появится тут"></textarea>

    <h3>2. Боб / Алиса</h3>
    <textarea id="inBox" placeholder="Вставьте код партнера сюда"></textarea>
    <button onclick="handleAccept()" style="background:#007bff">Принять Оффер (Боб)</button>
    <button onclick="handleFinal()" style="background:#6c757d">Завершить (Алиса)</button>

    <div id="chat" style="border:1px solid #ccc; height:80px; margin-top:10px; padding:5px; background:#fff"></div>
    <input type="text" id="msg" style="width:70%"><button onclick="handleSend()" style="width:25%; background:#333; padding:5px">OK</button>

<script>
    // Функция для вывода ошибок прямо на экран
    function showError(text) {
        const box = document.getElementById('errBox');
        box.innerText = text;
        box.style.display = 'block';
        console.error(text);
    }

    function log(text) {
        document.getElementById('log').innerText = text;
    }

    // Проверка поддержки WebRTC
    if (!window.RTCPeerConnection) {
        showError("Ваш браузер не поддерживает WebRTC!");
    }

    const config = { iceServers: [{ urls: "stun:://google.com" }] };
    let pc, dc;

    try {
        pc = new RTCPeerConnection(config);
        
        pc.onicecandidate = e => {
            if (!e.candidate && pc.localDescription) {
                document.getElementById('outBox').value = JSON.stringify(pc.localDescription);
                log("Код готов! Копируйте его.");
            }
        };

        pc.ondatachannel = e => setDC(e.channel);
    } catch(e) { showError("Ошибка инициализации: " + e.message); }

    function setDC(ch) {
        dc = ch;
        dc.onopen = () => { log("СВЯЗЬ ЕСТЬ!"); alert("Соединение установлено!"); };
        dc.onmessage = e => { document.getElementById('chat').innerHTML += "<div>ПАРТНЕР: "+e.data+"</div>"; };
    }

    async function handleCreate() {
        try {
            log("Генерация оффера...");
            dc = pc.createDataChannel("chat");
            setDC(dc);
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
        } catch(e) { showError("Ошибка в Шаге 1: " + e.message); }
    }

    async function handleAccept() {
        try {
            log("Прием оффера...");
            const input = document.getElementById('inBox').value.trim();
            if (!input) throw new Error("Поле пустое!");
            await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(input)));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
        } catch(e) { showError("Ошибка в Шаге 2: " + e.message); }
    }

    async function handleFinal() {
        try {
            log("Завершение...");
            const input = document.getElementById('inBox').value.trim();
            if (!input) throw new Error("Поле пустое!");
            await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(input)));
        } catch(e) { showError("Ошибка в Шаге 3: " + e.message); }
    }

    function handleSend() {
        const val = document.getElementById('msg').value;
        if (dc && dc.readyState === 'open') {
            dc.send(val);
            document.getElementById('chat').innerHTML += "<div>Я: "+val+"</div>";
            document.getElementById('msg').value = "";
        } else { alert("Связи еще нет!"); }
    }
</script>
</body>
</html>
