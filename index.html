<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>P2P Ultra-Light</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .err { color: red; border: 1px solid red; padding: 10px; display: none; }
        textarea { width: 100%; height: 100px; margin: 10px 0; font-size: 10px; }
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div id="error" class="err"></div>
    <div id="log">Статус: Готов</div>

    <button onclick="start()">1. НАЖМИ МЕНЯ (СОЗДАТЬ)</button>
    <textarea id="out" readonly></textarea>

    <script>
        function start() {
            try {
                document.getElementById('log').innerText = "Пробую создать соединение...";
                
                // Пробуем ВООБЩЕ БЕЗ СЕРВЕРОВ (для локального теста)
                // Если сработает так - значит проблема была в строке "stun:..."
                const pc = new RTCPeerConnection({ iceServers: [] });
                
                pc.onicecandidate = e => {
                    if (!e.candidate) {
                        document.getElementById('out').value = JSON.stringify(pc.localDescription);
                        document.getElementById('log').innerText = "ГОТОВО!";
                    }
                };

                const dc = pc.createDataChannel("t");
                pc.createOffer().then(o => pc.setLocalDescription(o));
                
            } catch (err) {
                document.getElementById('error').innerText = "ОШИБКА: " + err.message;
                document.getElementById('error').style.display = 'block';
            }
        }
    </script>
</body>
</html>
