<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background: #f0f0f0; }
        textarea { width: 100%; height: 100px; margin: 10px 0; font-size: 10px; }
        button { padding: 10px; width: 100%; cursor: pointer; background: #28a745; color: white; border: none; margin-bottom: 5px; }
        #chat { height: 100px; border: 1px solid #ccc; background: white; overflow-y: scroll; padding: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <h3>Шаг 1: Алиса</h3>
    <button onclick="doCreateOffer()">Создать Оффер</button>
    <textarea id="output" readonly></textarea>

    <h3>Шаг 2: Боб / Алиса</h3>
    <textarea id="input" placeholder="Вставьте код сюда"></textarea>
    <button onclick="doAcceptOffer()" style="background:#007bff">Принять Оффер (Боб)</button>
    <button onclick="doFinalize()" style="background:#6c757d">Завершить (Алиса)</button>

    <div id="chat"></div>
    <input type="text" id="msg" style="width:70%" placeholder="Сообщение...">
    <button onclick="doSend()" style="width:25%; background:#333">OK</button>

    <script>
        // Самый простой конфиг
        const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:://google.com" }] });
        let dc;

        // Следим за сбором данных для передачи
        pc.onicecandidate = e => {
            if (!e.candidate) {
                document.getElementById('output').value = JSON.stringify(pc.localDescription);
                console.log("Код готов!");
            }
        };

        pc.ondatachannel = e => setupDC(e.channel);

        function setupDC(chan) {
            dc = chan;
            dc.onopen = () => append("СИСТЕМА: СВЯЗЬ ЕСТЬ!");
            dc.onmessage = e => append("ПАРТНЕР: " + e.data);
        }

        async function doCreateOffer() {
            console.log("Создаю оффер...");
            dc = pc.createDataChannel("chat");
            setupDC(dc);
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
        }

        async function doAcceptOffer() {
            console.log("Принимаю оффер...");
            const str = document.getElementById('input').value;
            await pc.setRemoteDescription(JSON.parse(str));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
        }

        async function doFinalize() {
            console.log("Завершаю...");
            const str = document.getElementById('input').value;
            await pc.setRemoteDescription(JSON.parse(str));
        }

        function doSend() {
            const val = document.getElementById('msg').value;
            dc.send(val);
            append("Я: " + val);
            document.getElementById('msg').value = "";
        }

        function append(txt) {
            document.getElementById('chat').innerHTML += `<div>${txt}</div>`;
        }
    </script>
</body>
</html>
